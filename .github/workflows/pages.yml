name: Publish to GitHub Pages

on:
  push:
    branches: [claude/ar-food-menu-webapp-jqooe2]
  workflow_dispatch:

# Pushing the built site to a branch, rather than deploying through the Pages
# API: the workflow token on this repository is not permitted to create or
# deploy a Pages site, so the branch source is the one that works.
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # A project site is served from /<repo>/, so the base path is the repo
      # name. Taken from the event rather than hardcoded, so a fork deploys
      # without editing this file.
      - run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/

      # .nojekyll keeps Pages from touching the hashed asset filenames, and
      # 404.html doubles as the single-page-app entry point since Pages has no
      # rewrite rules of its own.
      - name: Prepare the published tree
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Push to gh-pages
        run: |
          cd dist
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish ${GITHUB_SHA::7}"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
