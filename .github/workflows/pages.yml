name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/ar-food-menu-webapp-jqooe2]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # A project site is served from /<repo>/, so the base path is the repo
      # name. Taken from the event rather than hardcoded, so a fork or a
      # separate build-only repo deploys without editing this file.
      - run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/

      # GitHub Pages has no rewrite rules, so the 404 page doubles as the
      # single-page-app entry point for /item/<id> and /menu.
      - run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
